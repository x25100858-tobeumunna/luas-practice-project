<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<title>myLUAS · Live Luas times</title>
<style>
  :root {
    --night: #060a14;
    --glass: rgba(12, 18, 32, 0.62);
    --glass-hi: rgba(255, 255, 255, 0.06);
    --line: rgba(255, 255, 255, 0.11);
    --text: #f1f4f8;
    --muted: #93a0b4;
    --amber: #ffb627;
    --amber-2: #ff8a1f;
    --red: #e4002b;
    --green: #00a651;
    --accent: var(--green);
    --accent-soft: rgba(0, 166, 81, .22);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  body.red { --accent: var(--red); --accent-soft: rgba(228, 0, 43, .24); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--night); }
  body { font-family: var(--sans); color: var(--text); min-height: 100dvh; -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---------- Scene: Dublin at night, a tram crossing the river (original SVG art) ---------- */
  .scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .scene svg { width: 100%; height: 100%; display: block; }
  .scene::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(6,10,20,.25), rgba(6,10,20,.45) 45%, rgba(6,10,20,.9)); }
  .tw { animation: tw 4s ease-in-out infinite; }
  @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: .9; } }
  .win { animation: win 7s ease-in-out infinite; }
  @keyframes win { 0%,100% { opacity: .85; } 50% { opacity: .35; } }
  .tram-run { animation: run 16s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes run { 0% { transform: translateX(-520px); } 100% { transform: translateX(1960px); } }
  .ripple { animation: ripple 6s ease-in-out infinite; }
  @keyframes ripple { 0%,100% { transform: scaleX(1); opacity: .5; } 50% { transform: scaleX(1.15); opacity: .2; } }
  .accent-fill { fill: var(--accent); transition: fill .4s; }
  .accent-stroke { stroke: var(--accent); transition: stroke .4s; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---------- Layout ---------- */
  .app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 24px;
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.35rem; letter-spacing: -.4px; }
  .logo-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent); box-shadow: 0 8px 24px var(--accent-soft); transition: background .4s; }
  .logo b { color: var(--accent); transition: color .4s; }
  .live { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    font-size: .72rem; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .live.on { color: #b9f5cf; } .live.on i { background: #4ade80; animation: pulse 2s infinite; }
  .live.off { color: #ffc2cb; } .live.off i { background: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,.6); } 70% { box-shadow: 0 0 0 9px rgba(74,222,128,0); } 100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); } }

  /* Picker */
  .picker { margin-top: 18px; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
  .picker label { grid-column: 1 / -1; font-size: .68rem; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .select-wrap { position: relative; }
  select { width: 100%; appearance: none; -webkit-appearance: none; cursor: pointer;
    font-size: 1.1rem; font-weight: 700; padding: 13px 42px 13px 14px; border-radius: 14px;
    background: rgba(255,255,255,.06); border: 1.5px solid var(--line); }
  select:focus { outline: none; border-color: var(--accent); }
  select option, select optgroup { background: #101727; color: var(--text); }
  .select-wrap::after { content: ""; position: absolute; right: 17px; top: 50%; width: 9px; height: 9px;
    border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .near { display: inline-flex; align-items: center; gap: 7px; padding: 13px 14px; border-radius: 14px; cursor: pointer;
    font-size: .88rem; font-weight: 700; background: rgba(255,255,255,.06); border: 1.5px solid var(--line); white-space: nowrap; }
  .near:hover { border-color: var(--accent); }
  .near.busy svg { animation: spin 1s linear infinite; }

  /* Hero */
  .hero { margin-top: 14px; padding: 22px 20px; position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 70%; height: 140%;
    background: radial-gradient(closest-side, var(--accent-soft), transparent); pointer-events: none; transition: background .4s; }
  .hero-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: relative; }
  .pill { font-size: .66rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; background: var(--accent); color: #fff; transition: background .4s; }
  .kicker { font-size: .7rem; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .hero h1 { position: relative; font-size: clamp(2.1rem, 9vw, 3.4rem); font-weight: 850; letter-spacing: -1.4px; line-height: 1.02; margin-top: 10px; }
  .next { position: relative; display: flex; align-items: center; gap: 18px; margin-top: 20px; }
  .ring { position: relative; width: 124px; height: 124px; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: rgba(255,255,255,.08); }
  .ring .prog { stroke: var(--amber); stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 0 6px rgba(255,182,39,.55)); }
  .ring-val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-val .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 800; font-size: 3rem; line-height: 1;
    color: var(--amber); text-shadow: 0 0 22px rgba(255,182,39,.45); }
  .ring-val .u { font-size: .72rem; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: #e0a43a; margin-top: 2px; }
  .ring-val.now .n { font-size: 1.9rem; animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: .35; } }
  .next-info .label { font-size: .7rem; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .next-info .dest { font-size: 1.45rem; font-weight: 800; letter-spacing: -.4px; margin-top: 4px; line-height: 1.15; }
  .next-info .dir { font-size: .88rem; color: #c3ccd9; margin-top: 4px; }

  /* Message + error */
  .message { margin-top: 14px; padding: 13px 15px; display: flex; gap: 11px; align-items: flex-start; font-size: .92rem; line-height: 1.45; color: #d3dae5; border-radius: 18px; }
  .message svg { flex-shrink: 0; margin-top: 1px; color: var(--amber); }
  .error { margin-top: 14px; padding: 14px 16px; border-radius: 18px; font-size: .92rem; line-height: 1.45;
    background: rgba(70, 10, 20, .78); border: 1px solid rgba(228,0,43,.55); color: #ffd0d6;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .error b { color: #fff; }
  .error button { margin-top: 9px; font-size: .82rem; font-weight: 800; cursor: pointer;
    background: #ffd0d6; color: #3a0710; border: none; border-radius: 999px; padding: 7px 15px; }

  /* Directions */
  .directions { display: grid; gap: 14px; margin-top: 14px; }
  .dir-card { overflow: hidden; }
  .dir-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--glass-hi); }
  .dir-head h2 { display: flex; align-items: center; gap: 9px; font-size: .74rem; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: #c7d0dd; }
  .dir-head h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 10px var(--accent); transition: background .4s; }
  .dir-head span { font-size: .72rem; color: var(--muted); }
  .tram { display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--line); animation: rise .35s ease-out both; }
  .tram:last-child { border-bottom: none; }
  .tram:nth-child(3) { animation-delay: .05s; } .tram:nth-child(4) { animation-delay: .1s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .dest { font-size: 1.12rem; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .approach { grid-column: 1; height: 4px; border-radius: 4px; background: rgba(255,255,255,.07); overflow: hidden; }
  .approach i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--amber)); transition: width .8s; }
  .due { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 800; color: var(--amber); text-shadow: 0 0 16px rgba(255,182,39,.4); white-space: nowrap; }
  .due .n { font-size: 2.5rem; line-height: 1; }
  .due .u { font-size: .78rem; margin-left: 4px; color: #e0a43a; font-weight: 700; }
  .due.now .n { font-size: 1.7rem; letter-spacing: 1px; animation: blink 1.1s steps(2, start) infinite; }
  .none { padding: 20px 18px; color: var(--muted); font-size: .95rem; }
  .sk { height: 58px; margin: 12px 18px; border-radius: 12px; background: linear-gradient(90deg, rgba(255,255,255,.04), rgba(255,255,255,.1), rgba(255,255,255,.04)); background-size: 200% 100%; animation: sk 1.3s infinite; }
  @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* Status bar */
  .statusbar { margin-top: 14px; padding: 12px 14px 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 18px; }
  .statusbar .upd { font-size: .82rem; color: var(--muted); }
  .statusbar .upd b { display: block; font-family: var(--mono); font-size: 1.05rem; color: var(--text); font-weight: 700; margin-top: 1px; }
  .refresh { position: relative; display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 6px 14px 6px 6px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid var(--line); font-size: .82rem; font-weight: 700; }
  .refresh:hover { border-color: var(--accent); }
  .mini-ring { width: 34px; height: 34px; position: relative; }
  .mini-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .mini-ring .t { stroke: rgba(255,255,255,.1); } .mini-ring .p { stroke: var(--accent); stroke-linecap: round; transition: stroke .4s; }
  .mini-ring .ic { position: absolute; inset: 0; display: grid; place-items: center; }
  .refresh.spin .ic svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { margin-top: auto; padding-top: 22px; text-align: center; font-size: .76rem; color: var(--muted); }

  /* Desktop */
  @media (min-width: 900px) {
    .app { padding: 26px; }
    .grid { display: grid; grid-template-columns: 420px 1fr; gap: 18px; align-items: start; margin-top: 18px; }
    .picker, .hero { margin-top: 0; }
    .left > * + * { margin-top: 14px; }
    .directions { margin-top: 0; grid-template-columns: 1fr 1fr; }
    .right > * + * { margin-top: 14px; }
  }
</style>
</head>

<div class="app">
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 11h16"/><path d="M8 21l2-4M16 21l-2-4"/><path d="M9 2h6"/>

      </div>
      <span>my<b>LUAS</b></span>
    </div>
    <div class="live glass" id="live"><i></i><span id="liveText">Connecting</span></div>

  <div class="grid">

          Nearest

      </div>

      <section class="hero glass" aria-live="polite">
        <div class="hero-top"><span class="pill" id="linePill">Luas</span><span class="kicker">Live departures</span></div>
        <h1 id="stopName">…</h1>
        <div class="next" id="next">
          <div class="ring">
            <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/><circle class="prog" id="ringProg" cx="60" cy="60" r="52" fill="none" stroke-width="9" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
            <div class="ring-val" id="ringVal"><span class="n">--</span><span class="u">min</span></div>
          </div>
          <div class="next-info">
            <div class="label">Next tram</div>
            <div class="dest" id="nextDest">Checking the line…</div>
            <div class="dir" id="nextDir"></div>
          </div>
        </div>
      </section>

      <div class="message glass" id="message" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span id="messageText"></span>
      </div>
      <div class="error" id="error" hidden></div>
    </div>

    <div class="right">
      <div class="directions" id="directions">
        <section class="dir-card glass"><div class="dir-head"><h2>Loading</h2></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></section>
        <section class="dir-card glass"><div class="dir-head"><h2>Loading</h2></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></section>
      </div>

      <div class="statusbar glass">
        <div class="upd">Last updated<b id="updated">--:--:--</b></div>
        <button class="refresh" id="refresh" type="button" aria-label="Refresh now">
          <span class="mini-ring">
            <svg viewBox="0 0 36 36"><circle class="t" cx="18" cy="18" r="15" fill="none" stroke-width="3"/><circle class="p" id="miniProg" cx="18" cy="18" r="15" fill="none" stroke-width="3" stroke-dasharray="94.25" stroke-dashoffset="94.25"/></svg>
            <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>
          </span>
          <span id="countdown">Refresh</span>
        </button>
      </div>
    </div>
  </div>

  <footer>Data: Transport Infrastructure Ireland. Built by Tobe Umunna for BDAIB.</footer>
</div>

<script>
const API = "https://luas-class.kluxy.app";
const DEFAULT_STOP = "MYS";
const STORE_KEY = "myluas.stop";
const REFRESH_MS = 20000;
const RING_MAX_MIN = 15;     // the hero ring is full when a tram is this many minutes away or more
const RING_C = 326.7, MINI_C = 94.25;

const $ = id => document.getElementById(id);
const select = $("stop");
let stops = [];
let currentStop = load() || DEFAULT_STOP;
let nextAt = 0, timer = null, inFlight = null;

/* ---------- helpers ---------- */
function load() { try { return localStorage.getItem(STORE_KEY); } catch { return null; } }
function save(v) { try { localStorage.setItem(STORE_KEY, v); } catch {} }
const pad = n => String(n).padStart(2, "0");
const clock = d => pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const isDue = d => d === 0 || Number(d) === 0 || String(d).toLowerCase() === "due";

async function getJSON(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 12000);
  let res;
  try { res = await fetch(url, { cache: "no-store", signal: ctrl.signal }); }
  catch (e) { throw new Error(e.name === "AbortError" ? "The request timed out." : "Network error: " + e.message); }
  finally { clearTimeout(t); }
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = null; }
  if (!res.ok) {
    const detail = (data && (data.error || data.message)) || text.slice(0, 160) || res.statusText;
    throw new Error("HTTP " + res.status + ": " + detail);
  }
  if (data === null) throw new Error("The server sent something that isn't valid JSON.");
  return data;
}

function showError(where, err) {
  const box = $("error");
  box.innerHTML = "<b>" + esc(where) + "</b><br>" + esc(err && err.message ? err.message : String(err)) +
    '<br><button type="button" id="retry">Try again</button>';
  box.hidden = false;
  $("retry").onclick = () => refresh();
  setLive("off", "Offline");
}
function clearError() { $("error").hidden = true; }
function setLive(state, text) { $("live").className = "live glass " + state; $("liveText").textContent = text; }

/* ---------- stops ---------- */
function setLine(line) {
  const red = String(line || "").toLowerCase() === "red";
  document.body.className = red ? "red" : "green";
  $("linePill").textContent = red ? "Red Line" : "Green Line";
  document.querySelector('meta[name="theme-color"]').content = red ? "#1a0610" : "#04140c";
}
function applyStop(id) {
  const s = stops.find(x => x.id === id);
  if (s) { $("stopName").textContent = s.name; setLine(s.line); }
  else $("stopName").textContent = id;
}

async function loadStops() {
  const data = await getJSON(API + "/stops");
  if (!data || !Array.isArray(data.stops) || !data.stops.length) throw new Error("The stop list came back empty.");
  stops = data.stops;
  select.innerHTML = "";
  [["red", "Red Line"], ["green", "Green Line"]].forEach(([key, label]) => {
    const group = document.createElement("optgroup");
    group.label = label;
    stops.filter(s => String(s.line).toLowerCase() === key).forEach(s => {
      const o = document.createElement("option");
      o.value = s.id; o.textContent = s.name;
      group.appendChild(o);
    });
    if (group.children.length) select.appendChild(group);
  });
  if (!stops.some(s => s.id === currentStop)) currentStop = stops.some(s => s.id === DEFAULT_STOP) ? DEFAULT_STOP : stops[0].id;
  select.value = currentStop;
  applyStop(currentStop);
}

function chooseStop(id) {
  currentStop = id;
  select.value = id;
  save(id);
  applyStop(id);
  $("message").hidden = true;
  $("directions").innerHTML = [0, 1].map(() => '<section class="dir-card glass"><div class="dir-head"><h2>Loading</h2></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></section>').join("");
  setHero(null);
  refresh();
}

/* ---------- nearest stop (uses the lat/lng in the stop list) ---------- */
function distKm(a, b, c, d) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(c - a), dLng = r(d - b);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
$("near").addEventListener("click", () => {
  const btn = $("near");
  if (!navigator.geolocation) return showError("Couldn't find your location.", new Error("This browser doesn't support location."));
  const located = stops.filter(s => Number.isFinite(+s.lat) && Number.isFinite(+s.lng));
  if (!located.length) return showError("Couldn't find the nearest stop.", new Error("The stop list has no coordinates."));
  btn.classList.add("busy");
  navigator.geolocation.getCurrentPosition(pos => {
    btn.classList.remove("busy");
    const { latitude, longitude } = pos.coords;
    let best = null, bestD = Infinity;
    located.forEach(s => { const d = distKm(latitude, longitude, +s.lat, +s.lng); if (d < bestD) { bestD = d; best = s; } });
    if (best) chooseStop(best.id);
  }, err => {
    btn.classList.remove("busy");
    showError("Couldn't find your location.", new Error(err.code === 1 ? "Location permission was denied." : err.message || "Location unavailable."));
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
});

/* ---------- rendering ---------- */
function dueHTML(due) {
  if (isDue(due)) return '<div class="due now"><span class="n">Due</span></div>';
  const n = Number(due);
  if (Number.isFinite(n)) return '<div class="due"><span class="n">' + n + '</span><span class="u">min</span></div>';
  return '<div class="due"><span class="n" style="font-size:1.3rem">' + esc(due) + "</span></div>";
}
function approachWidth(due) {
  if (isDue(due)) return 100;
  const n = Number(due);
  return Number.isFinite(n) ? Math.max(4, 100 - (n / RING_MAX_MIN) * 100) : 0;
}

function setHero(t) {
  const val = $("ringVal"), prog = $("ringProg");
  if (!t) {
    val.className = "ring-val"; val.innerHTML = '<span class="n">--</span><span class="u">min</span>';
    prog.style.strokeDashoffset = RING_C;
    $("nextDest").textContent = "Checking the line…"; $("nextDir").textContent = "";
    return;
  }
  const now = isDue(t.due), n = now ? 0 : Number(t.due);
  val.className = "ring-val" + (now ? " now" : "");
  val.innerHTML = now ? '<span class="n">Due</span><span class="u">now</span>' : '<span class="n">' + n + '</span><span class="u">min</span>';
  prog.style.strokeDashoffset = RING_C * (Math.min(n, RING_MAX_MIN) / RING_MAX_MIN);
  $("nextDest").textContent = t.destination || "—";
  $("nextDir").textContent = t.dir ? t.dir : "";
}

function render(data) {
  $("stopName").textContent = data.stopName || (stops.find(s => s.id === currentStop) || {}).name || currentStop;

  const msg = String(data.message || "").trim();
  $("messageText").textContent = msg;
  $("message").hidden = !msg;

  const dirs = Array.isArray(data.directions) ? data.directions : [];
  const wrap = $("directions");

  // soonest tram across both directions for the hero
  let soonest = null;
  dirs.forEach(d => (Array.isArray(d.trams) ? d.trams : []).forEach(t => {
    const n = isDue(t.due) ? 0 : Number(t.due);
    if (Number.isFinite(n) && (!soonest || n < soonest.n)) soonest = { ...t, n, dir: d.name };
  }));
  if (soonest) setHero(soonest);
  else { setHero(null); $("nextDest").textContent = "No trams due right now"; }

  if (!dirs.length) {
    wrap.innerHTML = '<section class="dir-card glass"><div class="dir-head"><h2>Trams</h2></div><div class="none">No tram information for this stop right now.</div></section>';
    return;
  }
  wrap.innerHTML = dirs.map(d => {
    const trams = (Array.isArray(d.trams) ? d.trams : []).slice(0, 3);
    const rows = trams.length
      ? trams.map(t => '<div class="tram"><div class="dest">' + esc(t.destination || "—") + "</div>" + dueHTML(t.due) +
          '<div class="approach"><i style="width:' + approachWidth(t.due) + '%"></i></div></div>').join("")
      : '<div class="none">No trams scheduled.</div>';
    return '<section class="dir-card glass"><div class="dir-head"><h2>' + esc(d.name || "Direction") + "</h2><span>Next " + trams.length + "</span></div>" + rows + "</section>";
  }).join("");
}

/* ---------- live refresh ---------- */
async function refresh() {
  const stop = currentStop;
  $("refresh").classList.add("spin");
  const req = getJSON(API + "/forecast?stop=" + encodeURIComponent(stop));
  inFlight = req;
  try {
    const data = await req;
    if (inFlight !== req || stop !== currentStop) return;
    render(data);
    clearError();
    $("updated").textContent = clock(new Date());
    setLive("on", "Live");
  } catch (e) {
    if (inFlight === req) showError("Couldn't load live trams for this stop.", e);
  } finally {
    if (inFlight === req) { $("refresh").classList.remove("spin"); schedule(); }
  }
}
function schedule() {
  clearTimeout(timer);
  nextAt = Date.now() + REFRESH_MS;
  timer = setTimeout(refresh, REFRESH_MS);
}
setInterval(() => {
  if (!nextAt) return;
  const left = Math.max(0, nextAt - Date.now());
  $("countdown").textContent = "Refresh in " + Math.ceil(left / 1000) + "s";
  $("miniProg").style.strokeDashoffset = MINI_C * (left / REFRESH_MS);
}, 200);
document.addEventListener("visibilitychange", () => { if (!document.hidden && Date.now() > nextAt) refresh(); });

select.addEventListener("change", () => chooseStop(select.value));
$("refresh").addEventListener("click", () => refresh());

(async function start() {
  try { await loadStops(); }
  catch (e) {
    showError("Couldn't load the stop list.", e);
    select.innerHTML = '<option value="' + esc(currentStop) + '">' + esc(currentStop) + "</option>";
    applyStop(currentStop);
  }
  refresh();
})();
</script>
</body>
</html>
