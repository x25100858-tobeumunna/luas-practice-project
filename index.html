<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060a14">
<title>myLUAS · Live Luas times</title>
<script>
  /* Apply the saved (or system) theme before the page paints, so there's no flash */
  (function () {
    let t = null;
    try { t = localStorage.getItem("myluas.theme"); } catch {}
    if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  /* ================= Theme tokens ================= */
  :root {
    --red: #e4002b;
    --green: #00a651;
    --purple: #6f2c91;            /* Luas brand purple */
    --accent: var(--purple);
    --accent-soft: rgba(111, 44, 145, .25);
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif;
  }
  body.red   { --accent: var(--red);   --accent-soft: rgba(228, 0, 43, .24); }
  body.green { --accent: var(--green); --accent-soft: rgba(0, 166, 81, .22); }

  /* Dublin by night */
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #060a14;
    --glass: rgba(12, 18, 32, .62);
    --glass-hi: rgba(255, 255, 255, .06);
    --field: rgba(255, 255, 255, .06);
    --line: rgba(255, 255, 255, .11);
    --text: #f1f4f8;
    --muted: #93a0b4;
    --soft: #c7d0dd;
    --digit: #ffb627;
    --digit-2: #e0a43a;
    --digit-glow: rgba(255, 182, 39, .45);
    --track: rgba(255, 255, 255, .08);
    --opt-bg: #101727;
    --veil: linear-gradient(180deg, rgba(6,10,20,.2), rgba(6,10,20,.45) 45%, rgba(6,10,20,.9));
    /* scene */
    --sky1: #050915; --sky2: #121b3a; --sky3: #2a2550; --sky4: #4a3060;
    --haze: rgba(255, 182, 39, .22);
    --far: #1c2244; --near: #0d1124; --deck: #0a0d1c; --deck-line: #2b3150; --pole: #262c4a; --wire: #3a4266;
    --river1: #1a1d3a; --river2: #05070f; --glint: #ffcf6b;
    --brick: #2a1a24; --brick-2: #23161f; --cornice: #3a2a35; --pane: #ffcf6b; --pane-op: .85; --door-op: .55;
    --tram-body: #e9edf3; --tram-glass: #16203a;
    --day: 0; --night: 1;
  }
  /* Dublin by day */
  [data-theme="light"] {
    color-scheme: light;
    --bg: #eef3f6;
    --glass: rgba(255, 255, 255, .74);
    --glass-hi: rgba(111, 44, 145, .05);
    --field: rgba(255, 255, 255, .85);
    --line: rgba(22, 28, 48, .11);
    --text: #121829;
    --muted: #5b6578;
    --soft: #343d52;
    --digit: #c2410c;
    --digit-2: #9a3412;
    --digit-glow: rgba(194, 65, 12, 0);
    --track: rgba(18, 24, 41, .08);
    --opt-bg: #ffffff;
    --veil: linear-gradient(180deg, rgba(238,243,246,0), rgba(238,243,246,.25) 45%, rgba(238,243,246,.85));
    /* scene */
    --sky1: #7fb6e0; --sky2: #b5daf0; --sky3: #e9eef0; --sky4: #f6dfc2;
    --haze: rgba(255, 214, 150, .35);
    --far: #b3c2d4; --near: #8d9db3; --deck: #4b5468; --deck-line: #6c768c; --pole: #5c667c; --wire: #6c768c;
    --river1: #5c9e98; --river2: #2b6466; --glint: #ffffff;
    --brick: #a2553a; --brick-2: #8f4a33; --cornice: #e9e2d6; --pane: #dfe9f2; --pane-op: 1; --door-op: 1;
    --tram-body: #f7f8fa; --tram-glass: #2a3550;
    --day: 1; --night: 0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--bg); }
  body { font-family: var(--sans); color: var(--text); min-height: 100dvh; -webkit-font-smoothing: antialiased; transition: color .4s; }
  button, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ================= Scene (original SVG art) ================= */
  .scene { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
  .scene svg { width: 100%; height: 100%; display: block; }
  .scene::after { content: ""; position: absolute; inset: 0; background: var(--veil); transition: background .6s; }
  .scene stop, .scene rect, .scene path, .scene polygon, .scene circle { transition: fill .6s, stop-color .6s, opacity .6s, stroke .6s; }
  .day-only   { opacity: var(--day); }
  .night-only { opacity: var(--night); }
  .tw  { animation: tw 4s ease-in-out infinite; }
  [data-theme="light"] .tw { animation: none; }
  @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: .9; } }
  .tram-run { animation: run 16s cubic-bezier(.45,.05,.55,.95) infinite; }
  @keyframes run { 0% { transform: translateX(-520px); } 100% { transform: translateX(1960px); } }
  .cloud { animation: cloud 70s linear infinite; }
  .cloud.b { animation-duration: 95s; animation-delay: -40s; }
  @keyframes cloud { from { transform: translateX(-300px); } to { transform: translateX(1700px); } }
  .gulls { animation: gulls 28s linear infinite; }
  @keyframes gulls { from { transform: translate(-150px, 0); } to { transform: translate(1650px, -80px); } }
  .ripple { animation: ripple 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ripple { 0%,100% { transform: scaleX(1); opacity: .55; } 50% { transform: scaleX(1.2); opacity: .2; } }
  .accent-fill { fill: var(--accent); }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ================= Layout ================= */
  .app { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .glass { background: var(--glass); border: 1px solid var(--line); border-radius: 24px;
    backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    transition: background .4s, border-color .4s; }
  [data-theme="light"] .glass { box-shadow: 0 10px 30px rgba(30, 40, 70, .08); }

  /* Top bar */
  .topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.35rem; letter-spacing: -.4px; }
  .logo-mark { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(140deg, var(--purple) 0%, var(--purple) 45%, var(--accent) 100%);
    box-shadow: 0 8px 24px var(--accent-soft); }
  .logo b { color: var(--accent); transition: color .4s; }
  [data-theme="light"] body:not(.red):not(.green) .logo b { color: var(--purple); }
  .top-right { display: flex; align-items: center; gap: 8px; }
  .live { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
    font-size: .7rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .live.on i { background: #22c55e; animation: pulse 2s infinite; }
  .live.off i { background: var(--red); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(34,197,94,.55); } 70% { box-shadow: 0 0 0 9px rgba(34,197,94,0); } 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); } }

  /* Theme toggle */
  .theme-toggle { position: relative; width: 64px; height: 34px; border-radius: 999px; cursor: pointer; padding: 0;
    border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .theme-toggle .knob { position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
    display: grid; place-items: center; background: #1d2440; color: #ffd98a;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); transition: transform .35s cubic-bezier(.3,1.4,.5,1), background .35s, color .35s; }
  [data-theme="light"] .theme-toggle .knob { transform: translateX(30px); background: #ffd25a; color: #7a4a00; }
  .theme-toggle .sun, [data-theme="light"] .theme-toggle .moon { display: none; }
  [data-theme="light"] .theme-toggle .sun { display: block; }

  /* Picker */
  .picker { margin-top: 18px; padding: 14px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }
  .picker label { grid-column: 1 / -1; font-size: .68rem; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .select-wrap { position: relative; }
  select { width: 100%; appearance: none; -webkit-appearance: none; cursor: pointer;
    font-size: 1.1rem; font-weight: 700; padding: 13px 42px 13px 14px; border-radius: 14px;
    background: var(--field); border: 1.5px solid var(--line); }
  select:focus { outline: none; border-color: var(--accent); }
  select.placeholder { color: var(--muted); }
  select option, select optgroup { background: var(--opt-bg); color: var(--text); }
  .select-wrap::after { content: ""; position: absolute; right: 17px; top: 50%; width: 9px; height: 9px;
    border-right: 2.5px solid var(--muted); border-bottom: 2.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
  .near { display: inline-flex; align-items: center; gap: 7px; padding: 13px 14px; border-radius: 14px; cursor: pointer;
    font-size: .88rem; font-weight: 700; background: var(--field); border: 1.5px solid var(--line); white-space: nowrap; }
  .near:hover { border-color: var(--accent); }
  .near.busy svg { animation: spin 1s linear infinite; }

  /* Hero */
  .hero { margin-top: 14px; padding: 22px 20px; position: relative; overflow: hidden; }
  .hero::before { content: ""; position: absolute; inset: -40% -20% auto auto; width: 70%; height: 140%;
    background: radial-gradient(closest-side, var(--accent-soft), transparent); pointer-events: none; }
  .hero-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; position: relative; }
  .pill { font-size: .66rem; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase;
    padding: 5px 10px; border-radius: 999px; background: var(--accent); color: #fff; transition: background .4s; }
  .kicker { font-size: .7rem; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .hero h1 { position: relative; font-size: clamp(2.1rem, 9vw, 3.4rem); font-weight: 850; letter-spacing: -1.4px; line-height: 1.02; margin-top: 10px; }
  .next { position: relative; display: flex; align-items: center; gap: 18px; margin-top: 20px; }
  .ring { position: relative; width: 124px; height: 124px; flex-shrink: 0; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { stroke: var(--track); }
  .ring .prog { stroke: var(--digit); stroke-linecap: round; transition: stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1), stroke .4s; filter: drop-shadow(0 0 6px var(--digit-glow)); }
  .ring-val { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ring-val .n { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 800; font-size: 3rem; line-height: 1;
    color: var(--digit); text-shadow: 0 0 22px var(--digit-glow); }
  .ring-val .u { font-size: .72rem; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--digit-2); margin-top: 2px; }
  .ring-val.now .n { font-size: 1.9rem; animation: blink 1.1s steps(2, start) infinite; }
  @keyframes blink { to { opacity: .35; } }
  .next-info .label { font-size: .7rem; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); }
  .next-info .dest { font-size: 1.45rem; font-weight: 800; letter-spacing: -.4px; margin-top: 4px; line-height: 1.15; }
  .next-info .dir { font-size: .88rem; color: var(--soft); margin-top: 4px; }

  /* Message + error */
  .message { margin-top: 14px; padding: 13px 15px; display: flex; gap: 11px; align-items: flex-start; font-size: .92rem; line-height: 1.45; color: var(--soft); border-radius: 18px; }
  .message svg { flex-shrink: 0; margin-top: 1px; color: var(--digit); }
  .error { margin-top: 14px; padding: 14px 16px; border-radius: 18px; font-size: .92rem; line-height: 1.45;
    background: rgba(70, 10, 20, .8); border: 1px solid rgba(228,0,43,.55); color: #ffd0d6;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  [data-theme="light"] .error { background: #fdecef; color: #7a0f22; border-color: #f3b6c0; }
  .error b { color: inherit; filter: brightness(1.2); }
  .error button { margin-top: 9px; font-size: .82rem; font-weight: 800; cursor: pointer;
    background: var(--red); color: #fff; border: none; border-radius: 999px; padding: 7px 15px; }

  /* Directions */
  .directions { display: grid; gap: 14px; margin-top: 14px; }
  .dir-card { overflow: hidden; }
  .dir-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--glass-hi); }
  .dir-head h2 { display: flex; align-items: center; gap: 9px; font-size: .74rem; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--soft); }
  .dir-head h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); box-shadow: 0 0 10px var(--accent-soft); transition: background .4s; }
  .dir-head span { font-size: .72rem; color: var(--muted); }
  .tram { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; align-items: center; padding: 15px 18px; border-bottom: 1px solid var(--line); animation: rise .35s ease-out both; }
  .tram:last-child { border-bottom: none; }
  .tram:nth-child(3) { animation-delay: .05s; } .tram:nth-child(4) { animation-delay: .1s; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .dest { font-size: 1.12rem; font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .approach { grid-column: 1; height: 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
  .approach i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--accent), var(--digit)); transition: width .8s; }
  .due { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 800; color: var(--digit); text-shadow: 0 0 16px var(--digit-glow); white-space: nowrap; }
  .due .n { font-size: 2.5rem; line-height: 1; }
  .due .u { font-size: .78rem; margin-left: 4px; color: var(--digit-2); font-weight: 800; }
  .due.now .n { font-size: 1.7rem; letter-spacing: 1px; animation: blink 1.1s steps(2, start) infinite; }
  .none { padding: 20px 18px; color: var(--muted); font-size: .95rem; line-height: 1.5; }
  .sk { height: 58px; margin: 12px 18px; border-radius: 12px; background: linear-gradient(90deg, var(--track), var(--line), var(--track)); background-size: 200% 100%; animation: sk 1.3s infinite; }
  @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* Status bar */
  .statusbar { margin-top: 14px; padding: 12px 14px 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-radius: 18px; }
  .statusbar .upd { font-size: .82rem; color: var(--muted); }
  .statusbar .upd b { display: block; font-family: var(--mono); font-size: 1.05rem; color: var(--text); font-weight: 700; margin-top: 1px; }
  .refresh { display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
    padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--field); border: 1px solid var(--line); font-size: .82rem; font-weight: 700; }
  .refresh:hover:not(:disabled) { border-color: var(--accent); }
  .refresh:disabled { opacity: .55; cursor: default; }
  .mini-ring { width: 34px; height: 34px; position: relative; }
  .mini-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .mini-ring .t { stroke: var(--track); } .mini-ring .p { stroke: var(--accent); stroke-linecap: round; transition: stroke .4s; }
  .mini-ring .ic { position: absolute; inset: 0; display: grid; place-items: center; }
  .refresh.spin .ic svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer { margin-top: auto; padding-top: 22px; text-align: center; font-size: .76rem; color: var(--muted); }
  [data-theme="light"] footer { color: #3c465a; }

  @media (min-width: 900px) {
    .app { padding: 26px; }
    .grid { display: grid; grid-template-columns: 420px 1fr; gap: 18px; align-items: start; margin-top: 18px; }
    .picker, .hero { margin-top: 0; }
    .left > * + * { margin-top: 14px; }
    .directions { margin-top: 0; grid-template-columns: 1fr 1fr; }
    .right > * + * { margin-top: 14px; }
  }
</style>
</head>
<body>

<!-- Scene: Dublin by day or by night — sky, spire, Georgian terraces, the Liffey, and a Luas crossing the bridge -->
<div class="scene" aria-hidden="true">
  <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky1)"/>
        <stop offset=".45" style="stop-color:var(--sky2)"/>
        <stop offset=".7" style="stop-color:var(--sky3)"/>
        <stop offset=".84" style="stop-color:var(--sky4)"/>
      </linearGradient>
      <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--river1)"/>
        <stop offset="1" style="stop-color:var(--river2)"/>
      </linearGradient>
      <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#fff" stop-opacity="0"/>
        <stop offset="1" style="stop-color:var(--haze)"/>
      </linearGradient>
      <radialGradient id="moonG" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff7e0" stop-opacity=".9"/><stop offset=".35" stop-color="#ffe7b0" stop-opacity=".25"/><stop offset="1" stop-color="#ffe7b0" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunG" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff6d8"/><stop offset=".3" stop-color="#ffe6a6" stop-opacity=".7"/><stop offset="1" stop-color="#ffe6a6" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <rect width="1440" height="900" fill="url(#sky)"/>
    <rect y="400" width="1440" height="220" fill="url(#haze)"/>

    <!-- night: moon + stars -->
    <g class="night-only">
      <circle cx="1120" cy="170" r="110" fill="url(#moonG)"/>
      <circle cx="1120" cy="170" r="26" fill="#fff4d6"/>
      <g fill="#fff">
        <circle class="tw" cx="110" cy="90" r="1.3"/><circle class="tw" cx="330" cy="160" r="1" style="animation-delay:1.2s"/>
        <circle class="tw" cx="540" cy="70" r="1.5" style="animation-delay:2s"/><circle class="tw" cx="780" cy="130" r="1" style="animation-delay:.6s"/>
        <circle class="tw" cx="930" cy="60" r="1.2" style="animation-delay:2.8s"/><circle class="tw" cx="1340" cy="110" r="1.4" style="animation-delay:1.7s"/>
        <circle class="tw" cx="660" cy="230" r=".9" style="animation-delay:3.2s"/><circle class="tw" cx="230" cy="260" r=".9" style="animation-delay:.3s"/>
      </g>
    </g>
    <!-- day: sun, clouds, gulls -->
    <g class="day-only">
      <circle cx="1120" cy="180" r="150" fill="url(#sunG)"/>
      <circle cx="1120" cy="180" r="34" fill="#fff3c9"/>
      <g class="cloud" fill="#fff" opacity=".9">
        <ellipse cx="200" cy="150" rx="70" ry="20"/><ellipse cx="245" cy="135" rx="45" ry="22"/><ellipse cx="160" cy="140" rx="35" ry="16"/>
      </g>
      <g class="cloud b" fill="#fff" opacity=".75">
        <ellipse cx="600" cy="240" rx="90" ry="18"/><ellipse cx="650" cy="225" rx="50" ry="20"/>
      </g>
      <g class="gulls" stroke="#3a4560" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M200 320 q7 -6 14 0 q7 -6 14 0"/><path d="M245 300 q6 -5 12 0 q6 -5 12 0"/><path d="M175 292 q5 -4 10 0 q5 -4 10 0"/>
      </g>
    </g>

    <!-- far city skyline -->
    <path d="M0 560 V500 h40 v-30 h30 v40 h50 v-60 h26 v60 h40 v-20 h60 v-50 h22 v50 h48 v-30 h70 v40 h40 v-70 h30 v70 h50 v-40 h60 v50 h40 v-30 h50 v40 h70 v-60 h24 v60 h56 v-30 h60 v40 h50 v-50 h30 v50 h70 v-20 h60 v-40 h40 v40 h70 v-30 h50 v60 V560Z" style="fill:var(--far)"/>
    <!-- a slender needle spire -->
    <polygon points="716,170 720,170 727,540 709,540" style="fill:var(--near)"/>
    <!-- a domed civic building -->
    <path d="M520 560 V500 h110 v60Z M548 500 a27 27 0 0 1 54 0Z M572 470 h6 v-10 h-6Z" style="fill:var(--near)"/>
    <!-- mid skyline -->
    <path d="M330 600 V545 h60 v-35 h50 v35 h40 v-25 h60 v25 h90 v-15 h80 v15 h40 v-55 h60 v55 h60 v-30 h80 v30 h60 v-20 h60 V600Z" style="fill:var(--near)"/>

    <!-- Georgian terraces (drawn by script) -->
    <g id="terraces"></g>

    <!-- bridge deck, track, overhead wire -->
    <rect y="600" width="1440" height="22" style="fill:var(--deck)"/>
    <rect y="622" width="1440" height="3" style="fill:var(--deck-line)"/>
    <g style="fill:var(--deck)">
      <rect x="100" y="625" width="16" height="70"/><rect x="460" y="625" width="16" height="70"/>
      <rect x="820" y="625" width="16" height="70"/><rect x="1180" y="625" width="16" height="70"/>
    </g>
    <path d="M116 640 Q288 690 460 640 M476 640 Q648 690 820 640 M836 640 Q1008 690 1180 640" style="stroke:var(--deck)" stroke-width="10" fill="none" opacity=".8"/>
    <path d="M0 548 H1440" style="stroke:var(--wire)" stroke-width="1.2"/>
    <g style="stroke:var(--pole)" stroke-width="4"><path d="M240 548 V600"/><path d="M640 548 V600"/><path d="M1040 548 V600"/></g>

    <!-- the Luas -->
    <g class="tram-run">
      <path d="M70 548 L92 562 L114 548" style="stroke:var(--wire)" stroke-width="2" fill="none"/>
      <rect x="0" y="562" width="420" height="36" rx="12" style="fill:var(--tram-body)"/>
      <rect x="0" y="588" width="420" height="10" rx="4" class="accent-fill"/>
      <rect x="0" y="562" width="420" height="5" rx="2" fill="#6f2c91"/>
      <g style="fill:var(--tram-glass)">
        <rect x="14" y="571" width="40" height="13" rx="3"/><rect x="62" y="571" width="40" height="13" rx="3"/>
        <rect x="120" y="571" width="40" height="13" rx="3"/><rect x="168" y="571" width="40" height="13" rx="3"/>
        <rect x="226" y="571" width="40" height="13" rx="3"/><rect x="274" y="571" width="40" height="13" rx="3"/>
        <rect x="332" y="571" width="40" height="13" rx="3"/>
      </g>
      <path d="M384 568 h26 q8 0 8 8 v10 h-34Z" style="fill:var(--tram-glass)"/>
      <circle cx="414" cy="592" r="3" fill="#fff6c8"/>
      <path class="night-only" d="M418 590 L560 580 L560 604 Z" fill="#fff6c8" opacity=".12"/>
      <rect x="110" y="562" width="3" height="36" fill="#c9d0db"/><rect x="216" y="562" width="3" height="36" fill="#c9d0db"/><rect x="322" y="562" width="3" height="36" fill="#c9d0db"/>
    </g>

    <!-- the Liffey -->
    <rect y="625" width="1440" height="275" fill="url(#river)"/>
    <g style="fill:var(--glint)">
      <rect class="ripple" x="180" y="690" width="70" height="2" rx="1"/>
      <rect class="ripple" x="410" y="720" width="50" height="2" rx="1" style="animation-delay:1s"/>
      <rect class="ripple" x="690" y="700" width="80" height="2" rx="1" style="animation-delay:2s"/>
      <rect class="ripple" x="990" y="740" width="60" height="2" rx="1" style="animation-delay:3s"/>
      <rect class="ripple" x="1230" y="710" width="70" height="2" rx="1" style="animation-delay:1.5s"/>
      <rect class="ripple" x="1095" y="770" width="50" height="2" rx="1" style="animation-delay:2.5s"/>
    </g>
    <rect y="760" width="1440" height="6" class="accent-fill" opacity=".1"/>
  </svg>
</div>

<div class="app">
  <div class="topbar">
    <div class="logo">
      <div class="logo-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="13" rx="3"/><path d="M4 11h16"/><path d="M8 21l2-4M16 21l-2-4"/><path d="M9 2h6"/>
        </svg>
      </div>
      <span>my<b>LUAS</b></span>
    </div>
    <div class="top-right">
      <div class="live glass" id="live"><i></i><span id="liveText">Choose a stop</span></div>
      <button class="theme-toggle" id="theme" type="button" aria-label="Switch between light and dark mode">
        <span class="knob">
          <svg class="moon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
      </button>
    </div>
  </div>

  <div class="grid">
    <div class="left">
      <div class="picker glass">
        <label for="stop">My stop</label>
        <div class="select-wrap">
          <select id="stop" aria-label="Choose your stop"><option value="">Loading stops…</option></select>
        </div>
        <button class="near" id="near" type="button" title="Use my location to find the nearest stop">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
          Nearest
        </button>
      </div>

      <section class="hero glass" aria-live="polite">
        <div class="hero-top"><span class="pill" id="linePill">Luas</span><span class="kicker">Live departures</span></div>
        <h1 id="stopName">My Stop</h1>
        <div class="next">
          <div class="ring">
            <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/><circle class="prog" id="ringProg" cx="60" cy="60" r="52" fill="none" stroke-width="9" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
            <div class="ring-val" id="ringVal"><span class="n">--</span><span class="u">min</span></div>
          </div>
          <div class="next-info">
            <div class="label">Next tram</div>
            <div class="dest" id="nextDest">Choose your stop</div>
            <div class="dir" id="nextDir">Pick one above, or tap Nearest.</div>
          </div>
        </div>
      </section>

      <div class="message glass" id="message" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span id="messageText"></span>
      </div>
      <div class="error" id="error" hidden></div>
    </div>

    <div class="right">
      <div class="directions" id="directions"></div>

      <div class="statusbar glass">
        <div class="upd">Last updated<b id="updated">--:--:--</b></div>
        <button class="refresh" id="refresh" type="button" aria-label="Refresh now" disabled>
          <span class="mini-ring">
            <svg viewBox="0 0 36 36"><circle class="t" cx="18" cy="18" r="15" fill="none" stroke-width="3"/><circle class="p" id="miniProg" cx="18" cy="18" r="15" fill="none" stroke-width="3" stroke-dasharray="94.25" stroke-dashoffset="94.25"/></svg>
            <span class="ic"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></span>
          </span>
          <span id="countdown">Waiting for a stop</span>
        </button>
      </div>
    </div>
  </div>

  <footer>Data: Transport Infrastructure Ireland. Built by Tobe Umunna for BDAIB.</footer>
</div>

<script>
const API = "https://luas-class.kluxy.app";
const STORE_KEY = "myluas.stop";
const THEME_KEY = "myluas.theme";
const REFRESH_MS = 20000;
const RING_MAX_MIN = 15;
const RING_C = 326.7, MINI_C = 94.25;

const $ = id => document.getElementById(id);
const select = $("stop");
let stops = [];
let currentStop = load(STORE_KEY) || "";   // empty = "My Stop" (nothing chosen yet)
let nextAt = 0, timer = null, inFlight = null;

/* ---------- helpers ---------- */
function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
function save(k, v) { try { localStorage.setItem(k, v); } catch {} }
const pad = n => String(n).padStart(2, "0");
const clock = d => pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const isDue = d => d === 0 || Number(d) === 0 || String(d).toLowerCase() === "due";

async function getJSON(url) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 12000);
  let res;
  try { res = await fetch(url, { cache: "no-store", signal: ctrl.signal }); }
  catch (e) { throw new Error(e.name === "AbortError" ? "The request timed out." : "Network error: " + e.message); }
  finally { clearTimeout(t); }
  const text = await res.text();
  let data; try { data = JSON.parse(text); } catch { data = null; }
  if (!res.ok) {
    const detail = (data && (data.error || data.message)) || text.slice(0, 160) || res.statusText;
    throw new Error("HTTP " + res.status + ": " + detail);
  }
  if (data === null) throw new Error("The server sent something that isn't valid JSON.");
  return data;
}

function showError(where, err) {
  const box = $("error");
  box.innerHTML = "<b>" + esc(where) + "</b><br>" + esc(err && err.message ? err.message : String(err)) +
    (currentStop ? '<br><button type="button" id="retry">Try again</button>' : "");
  box.hidden = false;
  const r = $("retry"); if (r) r.onclick = () => refresh();
  setLive("off", "Offline");
}
function clearError() { $("error").hidden = true; }
function setLive(state, text) { $("live").className = "live glass " + state; $("liveText").textContent = text; }

/* ---------- theme ---------- */
function themeColor() {
  const light = document.documentElement.dataset.theme === "light";
  const line = document.body.className;
  document.querySelector('meta[name="theme-color"]').content =
    light ? "#eef3f6" : line === "red" ? "#1a0610" : line === "green" ? "#04140c" : "#0d0818";
}
$("theme").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  document.documentElement.dataset.theme = next;
  save(THEME_KEY, next);
  themeColor();
});

/* ---------- stops ---------- */
function setLine(line) {
  const l = String(line || "").toLowerCase();
  document.body.className = l === "red" ? "red" : l === "green" ? "green" : "";
  $("linePill").textContent = l === "red" ? "Red Line" : l === "green" ? "Green Line" : "Luas";
  themeColor();
}
function applyStop(id) {
  const s = stops.find(x => x.id === id);
  $("stopName").textContent = s ? s.name : (id || "My Stop");
  setLine(s ? s.line : "");
  select.classList.toggle("placeholder", !id);
}

function emptyState() {
  clearTimeout(timer); nextAt = 0;
  applyStop("");
  setHero(null);
  $("nextDest").textContent = "Choose your stop";
  $("nextDir").textContent = "Pick one above, or tap Nearest.";
  $("message").hidden = true;
  $("directions").innerHTML = '<section class="dir-card glass"><div class="dir-head"><h2>Both directions</h2></div><div class="none">Choose <b>My Stop</b> to see the next three trams each way. Your choice is remembered on this device.</div></section>';
  $("refresh").disabled = true;
  $("countdown").textContent = "Waiting for a stop";
  $("miniProg").style.strokeDashoffset = MINI_C;
  setLive("", "Choose a stop");
}

async function loadStops() {
  const data = await getJSON(API + "/stops");
  if (!data || !Array.isArray(data.stops) || !data.stops.length) throw new Error("The stop list came back empty.");
  stops = data.stops;
  select.innerHTML = '<option value="" disabled>My Stop</option>';
  [["red", "Red Line"], ["green", "Green Line"]].forEach(([key, label]) => {
    const group = document.createElement("optgroup");
    group.label = label;
    stops.filter(s => String(s.line).toLowerCase() === key).forEach(s => {
      const o = document.createElement("option");
      o.value = s.id; o.textContent = s.name;
      group.appendChild(o);
    });
    if (group.children.length) select.appendChild(group);
  });
  if (currentStop && !stops.some(s => s.id === currentStop)) currentStop = "";
  select.value = currentStop;
}

function chooseStop(id) {
  currentStop = id;
  select.value = id;
  save(STORE_KEY, id);
  applyStop(id);
  clearError();
  $("message").hidden = true;
  $("directions").innerHTML = [0, 1].map(() => '<section class="dir-card glass"><div class="dir-head"><h2>Loading</h2></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></section>').join("");
  setHero(null);
  $("nextDest").textContent = "Checking the line…"; $("nextDir").textContent = "";
  $("refresh").disabled = false;
  refresh();
}

/* ---------- nearest stop ---------- */
function distKm(a, b, c, d) {
  const R = 6371, r = x => x * Math.PI / 180;
  const h = Math.sin(r(c - a) / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(r(d - b) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
$("near").addEventListener("click", () => {
  const btn = $("near");
  if (!navigator.geolocation) return showError("Couldn't find your location.", new Error("This browser doesn't support location."));
  const located = stops.filter(s => Number.isFinite(+s.lat) && Number.isFinite(+s.lng));
  if (!located.length) return showError("Couldn't find the nearest stop.", new Error("The stop list has no coordinates."));
  btn.classList.add("busy");
  navigator.geolocation.getCurrentPosition(pos => {
    btn.classList.remove("busy");
    const { latitude, longitude } = pos.coords;
    let best = null, bestD = Infinity;
    located.forEach(s => { const d = distKm(latitude, longitude, +s.lat, +s.lng); if (d < bestD) { bestD = d; best = s; } });
    if (best) chooseStop(best.id);
  }, err => {
    btn.classList.remove("busy");
    showError("Couldn't find your location.", new Error(err.code === 1 ? "Location permission was denied." : err.message || "Location unavailable."));
  }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
});

/* ---------- rendering ---------- */
function dueHTML(due) {
  if (isDue(due)) return '<div class="due now"><span class="n">Due</span></div>';
  const n = Number(due);
  if (Number.isFinite(n)) return '<div class="due"><span class="n">' + n + '</span><span class="u">min</span></div>';
  return '<div class="due"><span class="n" style="font-size:1.3rem">' + esc(due) + "</span></div>";
}
function approachWidth(due) {
  if (isDue(due)) return 100;
  const n = Number(due);
  return Number.isFinite(n) ? Math.max(4, 100 - (n / RING_MAX_MIN) * 100) : 0;
}
function setHero(t) {
  const val = $("ringVal"), prog = $("ringProg");
  if (!t) {
    val.className = "ring-val"; val.innerHTML = '<span class="n">--</span><span class="u">min</span>';
    prog.style.strokeDashoffset = RING_C;
    return;
  }
  const now = isDue(t.due), n = now ? 0 : Number(t.due);
  val.className = "ring-val" + (now ? " now" : "");
  val.innerHTML = now ? '<span class="n">Due</span><span class="u">now</span>' : '<span class="n">' + n + '</span><span class="u">min</span>';
  prog.style.strokeDashoffset = RING_C * (Math.min(n, RING_MAX_MIN) / RING_MAX_MIN);
  $("nextDest").textContent = t.destination || "—";
  $("nextDir").textContent = t.dir || "";
}

function render(data) {
  $("stopName").textContent = data.stopName || (stops.find(s => s.id === currentStop) || {}).name || currentStop;
  const msg = String(data.message || "").trim();
  $("messageText").textContent = msg;
  $("message").hidden = !msg;

  const dirs = Array.isArray(data.directions) ? data.directions : [];
  let soonest = null;
  dirs.forEach(d => (Array.isArray(d.trams) ? d.trams : []).forEach(t => {
    const n = isDue(t.due) ? 0 : Number(t.due);
    if (Number.isFinite(n) && (!soonest || n < soonest.n)) soonest = { ...t, n, dir: d.name };
  }));
  if (soonest) setHero(soonest);
  else { setHero(null); $("nextDest").textContent = "No trams due right now"; $("nextDir").textContent = ""; }

  const wrap = $("directions");
  if (!dirs.length) {
    wrap.innerHTML = '<section class="dir-card glass"><div class="dir-head"><h2>Trams</h2></div><div class="none">No tram information for this stop right now.</div></section>';
    return;
  }
  wrap.innerHTML = dirs.map(d => {
    const trams = (Array.isArray(d.trams) ? d.trams : []).slice(0, 3);
    const rows = trams.length
      ? trams.map(t => '<div class="tram"><div class="dest">' + esc(t.destination || "—") + "</div>" + dueHTML(t.due) +
          '<div class="approach"><i style="width:' + approachWidth(t.due) + '%"></i></div></div>').join("")
      : '<div class="none">No trams scheduled.</div>';
    return '<section class="dir-card glass"><div class="dir-head"><h2>' + esc(d.name || "Direction") + "</h2><span>Next " + trams.length + "</span></div>" + rows + "</section>";
  }).join("");
}

/* ---------- live refresh, every 20 seconds ---------- */
async function refresh() {
  const stop = currentStop;
  if (!stop) return;
  $("refresh").classList.add("spin");
  const req = getJSON(API + "/forecast?stop=" + encodeURIComponent(stop));
  inFlight = req;
  try {
    const data = await req;
    if (inFlight !== req || stop !== currentStop) return;
    render(data);
    clearError();
    $("updated").textContent = clock(new Date());
    setLive("on", "Live");
  } catch (e) {
    if (inFlight === req) showError("Couldn't load live trams for this stop.", e);
  } finally {
    if (inFlight === req) { $("refresh").classList.remove("spin"); schedule(); }
  }
}
function schedule() {
  clearTimeout(timer);
  nextAt = Date.now() + REFRESH_MS;
  timer = setTimeout(refresh, REFRESH_MS);
}
setInterval(() => {
  if (!nextAt || !currentStop) return;
  const left = Math.max(0, nextAt - Date.now());
  $("countdown").textContent = "Refresh in " + Math.ceil(left / 1000) + "s";
  $("miniProg").style.strokeDashoffset = MINI_C * (left / REFRESH_MS);
}, 200);
document.addEventListener("visibilitychange", () => { if (!document.hidden && currentStop && Date.now() > nextAt) refresh(); });

select.addEventListener("change", () => select.value && chooseStop(select.value));
$("refresh").addEventListener("click", () => refresh());

/* ---------- Georgian terraces with coloured doors (scene) ---------- */
(function buildTerraces() {
  const NS = "http://www.w3.org/2000/svg";
  const g = $("terraces");
  const DOORS = ["#c8102e", "#f2c230", "#2457a6", "#1f7a4d", "#6f2c91", "#e46b2e"];
  const mk = (tag, attrs, style) => { const el = document.createElementNS(NS, tag); for (const k in attrs) el.setAttribute(k, attrs[k]); if (style) el.setAttribute("style", style); g.appendChild(el); return el; };
  let doorIdx = 0;
  [[0, 5], [1110, 5]].forEach(([x0, count]) => {
    for (let i = 0; i < count; i++) {
      const w = 66, h = 118 + ((i * 17 + x0) % 26), x = x0 + i * w, y = 600 - h;
      mk("rect", { x, y, width: w, height: h }, "fill:var(" + (i % 2 ? "--brick-2" : "--brick") + ")");
      mk("rect", { x, y, width: w, height: 6 }, "fill:var(--cornice)");
      mk("rect", { x: x + w - 3, y, width: 3, height: h }, "fill:var(--brick-2);opacity:.6");
      for (let r = 0; r < 3; r++) for (let c = 0; c < 2; c++) {
        const wy = y + 16 + r * 26; if (wy + 20 > 560) continue;
        mk("rect", { x: x + 12 + c * 28, y: wy, width: 14, height: 20, class: (r + c + i) % 3 === 0 ? "tw" : "" },
          "fill:var(--pane);opacity:var(--pane-op);animation-duration:" + (6 + (i + r) % 5) + "s");
      }
      const color = DOORS[doorIdx++ % DOORS.length], dx = x + 24, dy = 572;
      mk("rect", { x: dx - 3, y: dy - 12, width: 24, height: 40 }, "fill:var(--cornice);opacity:.85");
      mk("path", { d: `M${dx} ${dy} a9 9 0 0 1 18 0Z`, fill: "#f3e9c8" }, "opacity:var(--pane-op)");
      mk("rect", { x: dx, y: dy, width: 18, height: 28, fill: color }, "opacity:var(--door-op)");
      mk("circle", { cx: dx + 13, cy: dy + 15, r: 1.4, fill: "#e8c56a" });
    }
  });
})();

/* ---------- start ---------- */
(async function start() {
  themeColor();
  emptyState();
  try { await loadStops(); }
  catch (e) {
    select.innerHTML = '<option value="" disabled>My Stop</option>' + (currentStop ? '<option value="' + esc(currentStop) + '">' + esc(currentStop) + "</option>" : "");
    select.value = currentStop;
    showError("Couldn't load the stop list.", e);
  }
  if (currentStop) chooseStop(currentStop);
  else { select.value = ""; applyStop(""); }
})();
</script>
</body>
</html>
